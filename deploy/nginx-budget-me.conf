# nginx site for Budget me. Copy to /etc/nginx/sites-available/budget-me,
# replace budget.example.com, link into sites-enabled, then get a certificate:
#   sudo certbot --nginx -d budget.example.com
# certbot fills in the ssl_certificate lines and keeps them renewed.

server {
    listen 80;
    listen [::]:80;
    server_name budget.example.com;
    # certbot replaces this with an HTTPS redirect
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name budget.example.com;

    # ssl_certificate     /etc/letsencrypt/live/budget.example.com/fullchain.pem;   # managed by certbot
    # ssl_certificate_key /etc/letsencrypt/live/budget.example.com/privkey.pem;     # managed by certbot

    # Receipts are shrunk in the browser; backups can be up to 5 MB.
    client_max_body_size 10m;
    server_tokens off;

    # Tell browsers to use HTTPS only (leave HSTS=false in .env so it isn't sent twice).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8090;   # APP_PORT from .env
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot forge their IP for the rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
