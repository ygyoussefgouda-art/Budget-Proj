name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # The Deploy workflow runs these tests first.
  workflow_call:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26" # same Node as the Docker image
      - name: Server - install, typecheck, test
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Web - install, test, build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Dependency audit (production, high+)
        run: |
          (cd server && npm audit --omit=dev --audit-level=high)
          (cd web && npm audit --omit=dev --audit-level=high)
      - name: E2E - install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: E2E - run (phone-sized browser against the real app)
        working-directory: e2e
        run: npx playwright test
      - name: E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/report
          retention-days: 7
      - name: Docker image builds
        run: docker build -t budget-me:ci .
      - name: Docker image starts and answers (with Postgres, hardened like production)
        run: |
          set -eu
          docker network create bm-ci
          docker run -d --name bm-ci-db --network bm-ci -e POSTGRES_DB=budget_me -e POSTGRES_USER=budget_me -e POSTGRES_PASSWORD=ci-only-password postgres:16-alpine
          for i in $(seq 1 30); do docker exec bm-ci-db pg_isready -U budget_me -d budget_me && break; sleep 2; done
          docker run -d --name bm-ci-app --network bm-ci -p 127.0.0.1:3000:3000 \
            --read-only --tmpfs /tmp:size=64m --cap-drop ALL --security-opt no-new-privileges:true \
            -e PGHOST=bm-ci-db -e PGDATABASE=budget_me -e PGUSER=budget_me -e PGPASSWORD=ci-only-password \
            -e COOKIE_SECURE=false budget-me:ci
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then ok=1; break; fi
            sleep 2
          done
          docker exec bm-ci-app node --version
          [ -n "$ok" ] || { docker logs bm-ci-app; exit 1; }
          curl -fsS http://127.0.0.1:3000/api/version
          curl -fsS http://127.0.0.1:3000/budget | grep -q 'id="root"'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/state)" = "401" ]
      - name: Docker logs (on failure)
        if: failure()
        run: docker logs bm-ci-app || true
