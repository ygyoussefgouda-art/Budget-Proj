name: Android
# Builds the Android app (Capacitor shell) on GitHub, since nobody needs the Android SDK at home.
# - Every push that touches mobile/ or the web app: a test (debug) APK, kept as a workflow artifact.
# - Tag android-v1.2.3 or "Run workflow" with release: a signed release APK, checked against the
#   release key; a tag also creates a GitHub Release with masrofy-1.2.3.apk attached (Orion Store
#   lists it from there). Published to the VPS too when the secrets below exist (docs/ANDROID_SELF_UPDATE.md §5-6):
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#     BUDGET_ME_URL, EXPECTED_CERT_SHA256 (optional), VPS_SSH_KEY + VPS (user@host) + VPS_KNOWN_HOSTS (optional)
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'web/src/native.ts', 'web/src/update.ts', '.github/workflows/android.yml']
    tags: ['android-v*']
  pull_request:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'versionName for a release (e.g. 0.7.0); empty = test build only'
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    if: ${{ !startsWith(github.ref, 'refs/tags/android-v') && !inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build a test APK
        working-directory: mobile
        env:
          # A placeholder address: a test build only needs to compile.
          BUDGET_ME_URL: ${{ secrets.BUDGET_ME_URL || 'https://budget.example.com' }}
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: masrofy-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/android-v') || inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Only this job may write: it creates the GitHub Release for android-v tags (Orion Store reads it).
    permissions:
      contents: write
    env:
      HAS_SSH_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The tag matches mobile/version.json
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          TAG="${GITHUB_REF_NAME#android-v}"
          NAME=$(node -p "require('./mobile/version.json').versionName")
          [ "$TAG" = "$NAME" ] || { echo "Tag $GITHUB_REF_NAME but mobile/version.json says $NAME: raise versionCode and versionName there first."; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Release key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Add the ANDROID_KEYSTORE_BASE64 secret first (see docs/ANDROID_SELF_UPDATE.md)."; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: SSH key for the VPS (optional)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        if: env.HAS_SSH_KEY == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Build, sign, check and publish
        env:
          BUDGET_ME_URL: ${{ secrets.BUDGET_ME_URL }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
          VPS: ${{ secrets.VPS }}
          VPS_DIR: /opt/masrofy/downloads/android
          VERSION: ${{ inputs.version || github.ref_name }}
          # versionCode was raised in mobile/version.json in the commit being released.
          KEEP_VERSION_CODE: 'true'
        run: sh mobile/scripts/release.sh "${VERSION#android-v}"
      # Never publish an APK signed with the wrong key (phones would refuse it as an update). release.sh
      # checks too, but skips the check when it can't find apksigner; here a missing tool or value fails.
      - name: Signed with the release key
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          [ -n "$EXPECTED_CERT_SHA256" ] || { echo "Set the EXPECTED_CERT_SHA256 secret."; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found: can't check the signature."; exit 1; }
          APK="mobile/dist/masrofy-${VERSION#android-v}.apk"
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          tr -d ':' < certs.txt | grep -qi "$(echo "$EXPECTED_CERT_SHA256" | tr -d ':')" || { echo "APK is NOT signed with the release key."; exit 1; }
      - name: GitHub Release with the APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#android-v}"
          gh release create "$GITHUB_REF_NAME" "mobile/dist/masrofy-$V.apk" \
            --repo "$GITHUB_REPOSITORY" --title "Masrofy $V" \
            --notes "Masrofy $V for Android: signed APK (package com.budgetme.app). Install it, or let the app update itself."
      - uses: actions/upload-artifact@v7
        with:
          name: masrofy-release
          path: |
            mobile/dist/*.apk
            mobile/dist/latest.json
          retention-days: 30
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" ~/.ssh/id_ed25519
