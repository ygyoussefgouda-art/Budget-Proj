# Budget me: production stack for a VPS.
# Its own Compose project ("budget-me"): own network, own Postgres, own volume.
# Nothing here touches other apps on the server; Postgres is never published.
#
#   cp .env.example .env && nano .env      # set the secrets (see DEPLOY.md)
#   docker compose up -d --build
name: budget-me

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" } # logs can't fill the disk

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-budget_me}
      POSTGRES_USER: ${POSTGRES_USER:-budget_me}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    shm_size: 128mb
    mem_limit: 512m
    logging: *logging
    networks: [internal]

  app:
    build: .
    image: budget-me:latest
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-budget_me}
      PGUSER: ${POSTGRES_USER:-budget_me}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Accounts: sign-up on/off, optional invite code, optional built-in "owner" account
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Accounts that can open the Admin page (comma separated; "owner" always can)
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      # HTTPS: the session cookie is only sent over HTTPS (set false only for a plain-HTTP test)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      HSTS: ${HSTS:-false}
      # Only trust X-Forwarded-For from the reverse proxy (see DEPLOY.md)
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      RECEIPT_QUOTA_MB: ${RECEIPT_QUOTA_MB:-200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIN_NATIVE_VERSION_CODE: ${MIN_NATIVE_VERSION_CODE:-0}
      AUDIT_KEEP_DAYS: ${AUDIT_KEEP_DAYS:-365}
      # Email for "Forgot password?" codes (empty SMTP_HOST = off)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Android app downloads: downloads/android/latest.json + budget-me-<version>.apk (see DEPLOY.md)
      DOWNLOADS_DIR: /app/downloads
      # Only the Android app may use Budget me; browsers get a "Get the app" page (false = website too)
      APP_ONLY: ${APP_ONLY:-true}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    volumes:
      - ./downloads:/app/downloads:ro
    ports:
      # Localhost only: your existing reverse proxy (nginx/Caddy) forwards HTTPS traffic here.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8090}:3000"
    # Hardening: read-only filesystem, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    logging: *logging
    networks: [internal]

  # Daily database backup (includes receipts) into ./backups, kept for BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-budget_me}
      PGUSER: ${POSTGRES_USER:-budget_me}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "backup: daily pg_dump to /backups, keeping $${KEEP_DAYS} days"
        while true; do
          f="/backups/budget-me-$$(date +%Y-%m-%d_%H%M).sql.gz"
          # Check the dump is complete (a failed pg_dump would still leave gzip happy).
          pg_dump --no-owner --no-privileges | gzip -9 > "$$f.part" || true
          if gunzip -c "$$f.part" 2>/dev/null | tail -n 5 | grep -q 'PostgreSQL database dump complete'; then
            mv "$$f.part" "$$f"; echo "backup: wrote $$f"
          else
            rm -f "$$f.part"; echo "backup: FAILED (incomplete dump, nothing kept)" >&2
          fi
          find /backups -name 'budget-me-*.sql.gz' -mtime +"$${KEEP_DAYS}" -delete
          sleep 86400
        done
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging: *logging
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
