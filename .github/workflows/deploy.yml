name: Deploy
# One-click deploy to the VPS: Actions → Deploy → Run workflow. It runs the tests first, then
# connects over SSH and runs deploy/update.sh (backup → pull → rebuild → wait until healthy).
# Does nothing until the owner adds these secrets (a separate key that may only run this):
#   VPS (user@host), VPS_SSH_KEY, VPS_KNOWN_HOSTS (output of: ssh-keyscan <host>), VPS_APP_DIR (default /opt/budget-me)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: Secrets present?
        if: env.HAS_KEY != 'true'
        run: |
          echo "Add the VPS, VPS_SSH_KEY and VPS_KNOWN_HOSTS secrets first (see DEPLOY.md, 'Operations')."
          exit 1
      - name: Update the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS: ${{ secrets.VPS }}
          APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/budget-me' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "$VPS" "cd '$APP_DIR' && git checkout --quiet main && sh deploy/update.sh"
      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
