name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # The Deploy workflow runs these tests first.
  workflow_call:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Server - install, typecheck, test
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Web - install, test, build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Dependency audit (production, high+)
        run: |
          (cd server && npm audit --omit=dev --audit-level=high)
          (cd web && npm audit --omit=dev --audit-level=high)
      - name: E2E - install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: E2E - run (phone-sized browser against the real app)
        working-directory: e2e
        run: npx playwright test
      - name: E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/report
          retention-days: 7
      - name: Docker image builds
        run: docker build -t budget-me:ci .
